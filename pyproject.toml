[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-token-saver"
version = "0.1.0"
description = "Dependency-free tools for compacting prompt text."
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
logprob = ["transformers>=4.40", "torch"]
test = ["pytest"]

[project.scripts]
pts = "prompt_token_saver.cli:main"

[tool.setuptools.packages.find]
include = ["prompt_token_saver*"]

[tool.setuptools.package-data]
prompt_token_saver = ["demo/*.md", "brief/constants.json"]
